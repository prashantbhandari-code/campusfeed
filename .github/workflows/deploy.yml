name: Deploy to Vercel

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  # Quality gate. This job exists because the pipeline previously went straight
  # from checkout to `vercel deploy --prod`, so a red commit shipped: the unit
  # suite never ran, and there are no git hooks. Nothing reaches production now
  # unless typecheck, lint and tests all pass.
  verify:
    name: Verify (typecheck, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Must run before typecheck/test: the Prisma client (and its types) is
      # generated, not checked in, and @prisma/client is a bare stub until then.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  deploy:
    name: Deploy to production
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_v7R8wXr6zylru5hVUsbSQhFz
          VERCEL_PROJECT_ID: prj_Xrh7t5APeaE1EDyrvoYrCrbVzoMT
        run: npx --yes vercel deploy --prod --yes --token "$VERCEL_TOKEN"
